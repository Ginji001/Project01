name: Hachiware Validate

on:
  push:
    branches: [hachiware-bullet]
  pull_request:
    branches: [hachiware-bullet]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files
        run: |
          test -f index.html
          test -f app.js.gz
          test -f styles.css.gz
          test -f manifest.webmanifest
          test -f sw.js
          test -f README.md
          test -f PRODUCTION_STATUS.md
          test -f RECOVERY_TARGET.md
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f icons/apple-touch-icon.png

      - name: Compressed source integrity
        run: |
          gzip -t app.js.gz
          gzip -t styles.css.gz
          gzip -dc app.js.gz > /tmp/hachiware-app.js
          gzip -dc styles.css.gz > /tmp/hachiware-styles.css
          test -s /tmp/hachiware-app.js
          test -s /tmp/hachiware-styles.css

      - name: Reconstructed source identity
        run: |
          echo "0900a4fa3f9141201c2d2d305cabdba75bb6843745b7d1bf1d27a1d1d9515a36  /tmp/hachiware-app.js" | sha256sum -c -
          echo "bca97d8455a38a879512deec34306d75087ef96d11cdbd915a017cf30c45e6b0  /tmp/hachiware-styles.css" | sha256sum -c -

      - name: JavaScript syntax
        run: |
          node --check /tmp/hachiware-app.js
          node --check sw.js

      - name: Manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - name: Loader and cache references
        run: |
          grep -F "./app.js.gz" index.html
          grep -F "./styles.css.gz" index.html
          grep -F "DecompressionStream" index.html
          grep -F '"./app.js.gz"' sw.js
          grep -F '"./styles.css.gz"' sw.js
          grep -F '"./manifest.webmanifest"' sw.js

      - name: Production isolation guard
        run: |
          grep -F "development mirror" PRODUCTION_STATUS.md
          grep -F "本番URLの置き換えには使用しません" README.md
          grep -F "Do not overwrite the production URL" RECOVERY_TARGET.md

      - name: No obvious secrets
        run: |
          ! grep -R -nE '(^|[^A-Za-z])(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' . --exclude-dir=.git
