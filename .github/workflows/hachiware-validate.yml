name: Hachiware Validate

on:
  push:
    branches: [hachiware-bullet]
  pull_request:
    branches: [hachiware-bullet]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files
        run: |
          test -f index.html
          test -f src/app.js
          test -f src/styles.css
          test -f manifest.webmanifest
          test -f sw.js
          test -f README.md
          test -f PRODUCTION_STATUS.md
          test -f RECOVERY_TARGET.md
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f icons/apple-touch-icon.png
          test -s src/app.js
          test -s src/styles.css

      - name: JavaScript syntax
        run: |
          node --check src/app.js
          node --check sw.js

      - name: Manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - name: App and cache references
        run: |
          grep -F 'href="./src/styles.css"' index.html
          grep -F 'src="./src/app.js"' index.html
          grep -F '"./src/app.js"' sw.js
          grep -F '"./src/styles.css"' sw.js
          grep -F '"./manifest.webmanifest"' sw.js

      - name: Production isolation guard
        run: |
          grep -F "development mirror" PRODUCTION_STATUS.md
          grep -F "本番URLの置き換えには使用しません" README.md
          grep -F "Do not overwrite the production URL" RECOVERY_TARGET.md

      - name: No obvious secrets
        run: |
          ! grep -R -nE '(^|[^A-Za-z])(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' . --exclude-dir=.git
