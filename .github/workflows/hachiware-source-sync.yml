name: Hachiware Source Sync

on:
  push:
    branches: [hachiware-bullet]

permissions:
  contents: write

jobs:
  sync-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize or rebuild source bundle
        run: |
          set -euo pipefail
          mkdir -p src

          if [ ! -f src/app.js ] || [ ! -f src/styles.css ]; then
            gzip -dc app.js.gz > src/app.js
            gzip -dc styles.css.gz > src/styles.css
          else
            gzip -n -9 -c src/app.js > app.js.gz.new
            gzip -n -9 -c src/styles.css > styles.css.gz.new
            mv app.js.gz.new app.js.gz
            mv styles.css.gz.new styles.css.gz
          fi

          node --check src/app.js
          test -s src/styles.css

          git add src/app.js src/styles.css app.js.gz styles.css.gz
          if git diff --cached --quiet; then
            echo "Source bundle already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Synchronize editable Hachiware source"
          git push origin HEAD:hachiware-bullet
