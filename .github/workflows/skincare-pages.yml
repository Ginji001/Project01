name: Deploy PWAs to GitHub Pages

on:
  push:
    branches: ["master"]
    paths:
      - "docs/skincare-pwa/**"
      - "docs/hachiware-solitaire/**"
      - "docs/cosmetics-manager-pwa/**"
      - "docs/cosmetics-manager-monitor/**"
      - ".github/workflows/skincare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "project01-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R docs/skincare-pwa/. _site/
          mkdir -p _site/hachiware-solitaire
          cp -R docs/hachiware-solitaire/. _site/hachiware-solitaire/
          mkdir -p _site/cosmetics-manager-pwa
          cp -R docs/cosmetics-manager-pwa/. _site/cosmetics-manager-pwa/
          mkdir -p _site/cosmetics-manager-monitor
          cp -R docs/cosmetics-manager-monitor/. _site/cosmetics-manager-monitor/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
