<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176f73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="スキンケア管理">
<title>スキンケア管理</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f4f8f7;color:#183334}.shell{max-width:620px;margin:auto;padding:18px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:0;font-size:24px}.muted{color:#687d7d;font-size:12px}.card{background:white;border:1px solid #dce8e6;border-radius:18px;padding:15px;margin:14px 0}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.btn{border:0;border-radius:11px;padding:10px 12px;background:#176f73;color:white;font-weight:700}.btn.alt{background:#dcefee;color:#176f73}.btn.danger{background:#fff;color:#b64242;border:1px solid #e7bcbc}input,select,textarea{width:100%;padding:11px;border:1px solid #dce8e6;border-radius:11px;font:inherit}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#687d7d;font-weight:700;margin-bottom:5px}.item{padding:11px 0;border-top:1px solid #e4eceb}.item:first-child{border-top:0}.item b{font-size:15px}.meta{font-size:12px;color:#687d7d;margin-top:3px}.check{width:26px;height:26px;border:2px solid #c9d9d7;border-radius:8px;background:#fff}.check.done{background:#176f73;border-color:#176f73;color:#fff}.progress{height:8px;background:#e3eceb;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:#176f73}.tabs{display:flex;gap:7px;overflow:auto}.tab{white-space:nowrap;border:1px solid #dce8e6;background:white;border-radius:999px;padding:8px 11px;font-weight:700}.tab.active{background:#176f73;color:#fff}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);border-top:1px solid #dce8e6;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;font-size:11px;padding:7px 2px;color:#687d7d;font-weight:700}.nav button.active{color:#176f73}.empty{text-align:center;padding:20px;color:#687d7d;border:1px dashed #dce8e6;border-radius:13px;font-size:13px}.complete{background:#dcefee;color:#176f73;text-align:center;padding:10px;border-radius:12px;font-weight:700}.modalbg{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:20}.modal{background:#fff;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.modal h3{margin-top:0}.weekday{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekday button{border:1px solid #dce8e6;background:white;border-radius:9px;padding:8px 2px}.weekday button.active{background:#176f73;color:white}.photo{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.photo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.dark{background:#0f1a1b;color:#edf6f5}.dark .card,.dark input,.dark select,.dark textarea,.dark .tab,.dark .modal,.dark .weekday button{background:#172527;color:#edf6f5;border-color:#2a3d3f}.dark .nav{background:#172527f2;border-color:#2a3d3f}
</style>
</head>
<body><div id="app"></div><script src="./app.js"></script></body>
</html>
