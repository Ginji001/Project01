<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#173f33">
  <meta name="color-scheme" content="light">
  <meta name="description" content="かわいい白黒ハチワレ猫と遊ぶ、難易度5段階のソリティアPWA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ハチワレソリティア">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>ハチワレソリティア</title>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <img class="mascot" src="icon.svg" alt="白黒のハチワレ猫">
        <div>
          <h1>ハチワレソリティア</h1>
          <p id="catLine">今日も1局いくにゃ。</p>
        </div>
      </div>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="設定">⚙︎</button>
    </header>

    <section class="status-bar" aria-label="ゲーム情報">
      <div><span>難易度</span><strong id="difficultyLabel">2</strong></div>
      <div><span>手数</span><strong id="movesLabel">0</strong></div>
      <div><span>時間</span><strong id="timeLabel">00:00</strong></div>
      <div><span>山札</span><strong id="redealLabel">∞</strong></div>
    </section>

    <section class="toolbar" aria-label="操作">
      <button id="undoBtn" type="button">↶ やり直し</button>
      <button id="hintBtn" type="button">💡 ヒント</button>
      <button id="newBtn" type="button">↻ 新しいゲーム</button>
    </section>

    <main class="game-area" id="gameArea" aria-label="ソリティア盤面">
      <section class="top-row" aria-label="山札と組札">
        <div class="pile-wrap">
          <span class="pile-label">山札</span>
          <button class="pile stock" id="stockPile" type="button" aria-label="山札"></button>
        </div>
        <div class="pile-wrap">
          <span class="pile-label">捨て札</span>
          <button class="pile waste" id="wastePile" type="button" aria-label="捨て札"></button>
        </div>
        <div class="top-spacer"></div>
        <div class="foundations" id="foundations" aria-label="組札"></div>
      </section>

      <section class="tableau" id="tableau" aria-label="場札"></section>
    </main>

    <section class="helper-card" aria-live="polite">
      <img src="icon.svg" alt="" aria-hidden="true">
      <div>
        <strong id="helperTitle">ハチワレからひとこと</strong>
        <p id="helperText">カードをタップして選び、移動先をタップしてね。</p>
      </div>
    </section>

    <footer class="app-footer">
      <span id="saveLabel">自動保存：ON</span>
      <span>オフライン対応</span>
    </footer>
  </div>

  <div class="sheet-backdrop hidden" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <section class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 id="settingsTitle">ゲーム設定</h2>
        <button class="icon-btn" id="closeSettingsBtn" type="button" aria-label="閉じる">×</button>
      </div>

      <h3>難易度</h3>
      <div class="difficulty-grid" id="difficultyGrid"></div>

      <div class="settings-block">
        <h3>記録</h3>
        <div id="statsList" class="stats-list"></div>
      </div>

      <div class="settings-block">
        <h3>ホーム画面に追加</h3>
        <p>iPhoneではSafariで開き、共有 →「ホーム画面に追加」でアプリとして使えます。</p>
        <button class="secondary-btn hidden" id="installBtn" type="button">この端末にインストール</button>
      </div>

      <div class="settings-actions">
        <button class="danger-btn" id="resetStatsBtn" type="button">記録をリセット</button>
      </div>
    </section>
  </div>

  <div class="sheet-backdrop hidden" id="winSheet" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <section class="win-card">
      <img src="icon.svg" alt="喜ぶ白黒のハチワレ猫">
      <p class="confetti" aria-hidden="true">♠︎ ♥︎ ♣︎ ♦︎</p>
      <h2 id="winTitle">クリアだにゃ！</h2>
      <p id="winSummary"></p>
      <div class="win-actions">
        <button id="winNewBtn" type="button">もう一度遊ぶ</button>
        <button class="secondary-btn" id="winCloseBtn" type="button">盤面を見る</button>
      </div>
    </section>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
